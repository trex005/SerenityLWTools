      <stop offset=".48" stop-color="#111a27"/>
      <stop offset="1" stop-color="#080e18"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="1000" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#66758a" stop-opacity=".08"/>
      <stop offset=".48" stop-color="#66758a" stop-opacity="0"/>
      <stop offset="1" stop-color="#66758a" stop-opacity=".10"/>
    </linearGradient>
    <pattern id="weave" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M0 36 36 0 72 36 36 72Z" stroke="#68778e" stroke-opacity=".035"/>
