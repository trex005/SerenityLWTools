  <use href="#star" transform="translate(1015 870) rotate(32) scale(.9)" opacity=".08"/>
  <path d="M-100 910c400-65 585 53 900-5s542-6 900-90" stroke="#6f8096" stroke-opacity=".07" stroke-width="2"/>
  <path d="M-100 935c400-65 585 53 900-5s542-6 900-90" stroke="#6f8096" stroke-opacity=".035"/>
